# enable mise settings experimental=true

monorepo_root = true

[settings]
# Run every task's commands through nushell on all platforms.
windows_default_inline_shell_args = "nu -c"
unix_default_inline_shell_args = "nu -c"

[monorepo]
config_roots = [
    "packages/igloo-ts",
    "packages/igloo-py",
    "plugins/js",
    "plugins/python",
    "plugins/rust",
    "examples/rust_host",
]

[tools]
"github:bytecodealliance/wit-bindgen" = "0.55.0"
wasmtime = "43"
[tools."github:bytecodealliance/wasm-pkg-tools"]
version = "latest"
bin = "wkg"
[tools."github:bytecodealliance/wasm-pkg-tools".platforms]
windows-x64 = { bin = "wkg.exe" }

node = "22"
pnpm = "latest"
"npm:@bytecodealliance/jco" = "latest"
uv = "latest"
"aqua:nushell/nushell" = "0.115.1"

[tasks.setup]
description = "Install the wasm target and all mise-managed tools"
run = [
    "rustup target add wasm32-wasip2",
    "mise install",
]

[tasks.run]
description = "Run the iced host example"
depends = ["//examples/rust_host:run"]

[tasks.build-plugins]
description = "Build every guest plugin (Rust, JS, Python)"
depends = [
    "//plugins/rust:build",
    "//plugins/js:build",
    "//plugins/python:build",
]

# Build WIT package
[tasks."wit:build"]
description = "Build WIT package from crates/igloo/wit"
sources = ["crates/igloo/wit/**/*.wit"]
outputs = ["iced-app.wasm"]
run = "wkg wit build --wit-dir crates/igloo/wit -o iced-app.wasm"

# Publish WIT package to ghcr.io
[tasks."wit:publish"]
description = "Build and publish WIT package to ghcr.io"
depends = ["wit:build"]
run = "wkg publish --package iced:app@0.1.0 iced-app.wasm"
