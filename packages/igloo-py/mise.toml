[tasks.gen]
description = "Generate WIT bindings for igloo-py"
sources = ["../../crates/igloo/wit/**/*.wit"]
outputs = ["src/wit_world/**/*"]
run = """
rm -rf src/wit_world
uv run componentize-py --wit-path ../../crates/igloo/wit bindings src
# Move componentize-py support files into igloo_py/ to keep them in sync
rm -rf src/igloo_py/componentize_py_async_support
mv src/componentize_py_async_support src/igloo_py/
mv -f src/componentize_py_types.py src/igloo_py/componentize_py_types.py
mv -f src/poll_loop.py src/igloo_py/poll_loop.py
mv -f src/componentize_py_runtime.pyi src/igloo_py/componentize_py_runtime.pyi
"""

[tasks.check]
description = "Type check igloo-py with pyrefly"
run = "uv run pyrefly check --project-excludes '**/wit_world/**' --project-excludes '**/poll_loop.py' --project-excludes '**/componentize_py_async_support/**' --project-excludes '**/componentize_py_types.py'"

[tasks.fmt]
description = "Format igloo-py with ruff"
run = "uv run ruff format src/"

[tasks.lint]
description = "Lint igloo-py with ruff"
run = "uv run ruff check src/"
