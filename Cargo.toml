[workspace.package]
edition = "2024"

[workspace]
resolver = "3"
members = [
    "crates/igloo_guest",
    "crates/igloo",
    "examples/*",
    "plugins/rust",
    "plugins/native_counter",
    "crates/igloo_native",
]


[workspace.dependencies]
igloo_guest = { path = "crates/igloo_guest" }
igloo = { path = "crates/igloo" }
igloo_native = { path = "crates/igloo_native", default-features = false }

anyhow = "1.0.104"
bitflags = "2.13.2"
futures = "0.3.34"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1.54.1" }

iced = { version = "0.15.0-dev", features = [
    "advanced",
    "tokio",
    "image",
    "markdown",
    "svg",
] }
iced_core = { version = "0.15.0-dev" }
iced_widget = { version = "0.15.0-dev", default-features = false }
stabby = "72.1.16"
libloading = "0.9.0"
wit-bindgen = "0.63.0"
wasmtime = "50.0.0"
wasmtime-wasi = "50.0.0"
tracing = "0.1.44"
thiserror = "2.0.21"

[patch.crates-io]
iced = { git = "https://github.com/n1ght-hunter/iced.git", rev = "91be065" }
iced_core = { git = "https://github.com/n1ght-hunter/iced.git", rev = "91be065" }
iced_widget = { git = "https://github.com/n1ght-hunter/iced.git", rev = "91be065" }

[workspace.lints.rust]
missing_debug_implementations = "deny"
missing_docs = "allow"
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "deny"
# unused_results = "deny"


[workspace.lints.clippy]
default_trait_access = "deny"
filter_map_next = "deny"
from_over_into = "deny"
manual_let_else = "deny"
match-wildcard-for-single-variants = "deny"
needless_borrow = "deny"
new_without_default = "deny"
redundant-closure-for-method-calls = "deny"
semicolon_if_nothing_returned = "deny"
trivially-copy-pass-by-ref = "deny"
type-complexity = "allow"
unused_async = "deny"
useless_conversion = "deny"
upper_case_acronyms = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "forbid"
