[workspace.package]
edition = "2024"

[workspace]
resolver = "3"
members = [
    "crates/igloo_guest",
    "crates/igloo",
    "examples/*",
    "examples/rust_host/guest",
]


[workspace.dependencies]
igloo_guest = { path = "crates/igloo_guest" }
igloo = { path = "crates/igloo" }

anyhow = "1"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tokio = { version = "1" }

iced = { version = "0.14.0", features = [
    "advanced",
    "tokio",
    "image",
    "markdown",
    "svg",
] }
iced_core = { version = "0.14.0" }
iced_widget = { version = "0.14.2", default-features = false }
wit-bindgen = "0.51.0"
wasmtime = "40.0.2"
wasmtime-wasi = "40.0.2"
tracing = "0.1.44"
thiserror = "2.0.17"

[workspace.lints.rust]
missing_debug_implementations = "deny"
missing_docs = "allow"
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "deny"
# unused_results = "deny"


[workspace.lints.clippy]
default_trait_access = "deny"
filter_map_next = "deny"
from_over_into = "deny"
manual_let_else = "deny"
match-wildcard-for-single-variants = "deny"
needless_borrow = "deny"
new_without_default = "deny"
redundant-closure-for-method-calls = "deny"
semicolon_if_nothing_returned = "deny"
trivially-copy-pass-by-ref = "deny"
type-complexity = "allow"
unused_async = "deny"
useless_conversion = "deny"
upper_case_acronyms = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "forbid"
